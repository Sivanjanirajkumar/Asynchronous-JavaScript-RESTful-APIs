<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Real-time weather dashboard using JavaScript and REST API">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-container">

        <h1>Weather Dashboard</h1>
        <p class="subtitle">Check real-time weather information</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                aria-label="Enter city name"
            >

            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <section id="weatherCard" class="weather-card hidden">

            <h2 id="cityName">City</h2>

            <div class="weather-info">

    <div class="weather-item">
        <h3>🌡️ Temperature</h3>
        <p id="temperature">--</p>
    </div>

    <div class="weather-item">
        <h3>💧 Humidity</h3>
        <p id="humidity">--</p>
    </div>

    <div class="weather-item">
        <h3>💨 Wind Speed</h3>
        <p id="windSpeed">--</p>
    </div>

    <div class="weather-item">
        <h3>🌤️ Condition</h3>
        <p id="condition">--</p>
    </div>

</div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
